<style id="splash-css">
html{background:#f6f7fb}html[data-theme=dark]{background:#0b1220}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#f6f7fb;color:#0f172a;font:700 22px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.3px;opacity:1;transition:opacity .22s ease,visibility 0s linear .22s}
#splash b{color:#3358d4;font-weight:700}
#splash .sl{width:64px;height:64px;border-radius:16px;background:#3358d4;color:#fff;display:grid;place-items:center;animation:splash-in .35s ease both,splash-breathe 1.8s ease-in-out .35s infinite}
#splash .sl svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#splash .sb{width:56px;height:3px;border-radius:3px;background:rgba(51,88,212,.18);overflow:hidden}
#splash .sb i{display:block;width:40%;height:100%;border-radius:3px;background:#3358d4;animation:splash-bar 1.1s ease-in-out infinite}
html[data-theme=dark] #splash{background:#0b1220;color:#e8edf5}
html[data-theme=dark] #splash b{color:#6f8ff0}
html[data-theme=dark] #splash .sl{background:#6f8ff0;color:#0b1220}
html[data-theme=dark] #splash .sb{background:rgba(111,143,240,.2)}
html[data-theme=dark] #splash .sb i{background:#6f8ff0}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash{animation:splash-away .25s ease 8s forwards}
@keyframes splash-away{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes splash-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes splash-breathe{50%{transform:scale(1.05)}}
@keyframes splash-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;transition:none!important}#splash{transition:none!important;animation-duration:.01s}}   /* the 8 s safety fade-out below still works with reduced motion, so the splash can never stay on top */
</style>
