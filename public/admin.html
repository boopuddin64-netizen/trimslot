<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3358d4">
<title>TrimSlot admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/avatars.css">
<link rel="stylesheet" href="/admin.css">
<script src="/theme.js"></script>
</head>
<body class="adm">
<header class="topbar"><a class="brand" href="/admin.html"><span class="logo"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></span>Trim<b>Slot</b> <span class="tag-admin">Admin</span></a><div style="display:flex;align-items:center;gap:8px"><button class="btn sm sec" id="adminRefresh" type="button" aria-label="Refresh admin page" title="Refresh admin page">↻ Refresh</button><div id="topright"></div></div></header>
<div id="shell" class="hidden">
  <nav id="nav" class="anav" aria-label="Admin sections"></nav>
  <main id="app" aria-live="polite"></main>
</div>
<main id="login" class="login hidden">
  <div class="card">
    <h1>Admin sign in</h1>
    <p class="muted small">Enter the admin key. It is kept in this browser tab only and is cleared when you close the tab or sign out.</p>
    <form id="lf" autocomplete="off">
      <label for="key">Admin key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" required>
      <div id="lmsg" class="err hidden"></div>
      <div class="btns cta"><button class="btn" type="submit">Sign in</button></div>
    </form>
  </div>
</main>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/forms.js"></script>
<script src="/admin.js"></script>
<script src="/admin2.js"></script>
<script src="/admin3.js"></script>
<script src="/admin4.js"></script>
<script src="/admin5.js"></script>
<script>
(function () {
  const refresh = document.getElementById('adminRefresh');
  if (refresh) refresh.addEventListener('click', function () {
    this.disabled = true; this.textContent = 'Refreshing…';
    // Force a fresh navigation; the service worker must not trap the admin on stale HTML.
    window.location.href = '/admin.html?refresh=' + Date.now();
  });
  // Fail safe: if one of the admin bundles throws before startup, never leave a blank screen.
  function recoverBlankAdmin() {
    const shell = document.getElementById('shell');
    const login = document.getElementById('login');
    const app = document.getElementById('app');
    const nav = document.getElementById('nav');
    if (shell && login && shell.classList.contains('hidden') && login.classList.contains('hidden')) {
      login.classList.remove('hidden');
      const msg = document.getElementById('lmsg');
      if (msg) { msg.textContent = 'The admin interface did not start correctly. Reload this page and try again.'; msg.classList.remove('hidden'); }
    } else if (shell && !shell.classList.contains('hidden') && app && nav && !app.textContent.trim() && !nav.textContent.trim()) {
      app.innerHTML = '<section class="card"><h2>Admin page did not finish loading</h2><p>Please use Refresh to reload the page. Your saved data has not been changed by this message.</p><button class="btn" type="button" onclick="location.href=\'/admin.html?refresh=\'+Date.now()">Reload admin</button></section>';
    }
  }
  window.addEventListener('error', function () { setTimeout(recoverBlankAdmin, 0); });
  window.addEventListener('unhandledrejection', function () { setTimeout(recoverBlankAdmin, 0); });
  window.addEventListener('load', function () { setTimeout(recoverBlankAdmin, 1800); });
})();
</script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
