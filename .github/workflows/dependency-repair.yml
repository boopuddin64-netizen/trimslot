name: One-time dependency security repair

on:
  push:
    branches:
      - security/phase-1-hardening

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/phase-1-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install current lockfile
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix

      - name: Commit patched lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: patch vulnerable npm dependencies"
          git push origin HEAD:security/phase-1-hardening
