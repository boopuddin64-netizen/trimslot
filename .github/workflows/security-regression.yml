name: TrimSlot security and regression checks

on:
  push:
    branches:
      - main
      - security/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trimslot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check source and tests
        run: npm run typecheck

      - name: Run PostgreSQL-backed regression tests
        run: npm test

      - name: Verify production build
        run: npm run build
