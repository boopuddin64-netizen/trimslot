# LEGACY / ALTERNATIVE path: app + its own Postgres 17 on one VPS. (Primary path = Vercel + Supabase, see DEPLOY.md.)
# Put Caddy (docker-compose.caddy.yml) in front for HTTPS.
#   cp .env.example .env   # fill in JWT_SECRET, PAYSTACK_SECRET_KEY, APP_BASE_URL, POSTGRES_PASSWORD, CRON_SECRET (optional)
#   docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trimslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trimslot
      TZ: UTC
    volumes:
      - trimslot-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimslot -d trimslot"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    image: trimslot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://trimslot:${POSTGRES_PASSWORD}@db:5432/trimslot
      DATABASE_SSL: "false"              # same-host Postgres on the private compose network
      AUTO_MIGRATE: "true"
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWEEP_EVERY_SECONDS: ${SWEEP_EVERY_SECONDS:-60}   # in-process hold sweeper (a long-running server can do this itself)
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"   # loopback only; Caddy/nginx (or a tunnel) is the public entrypoint
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  trimslot-pg:
